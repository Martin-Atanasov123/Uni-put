<!doctype html>
<html data-theme="dark" lang="bg" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/university.png"  />
    <link rel="preconnect" href="https://vryaoxncvtnpsngkqteq.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <!-- Inter is self-hosted via @fontsource-variable/inter (see main.jsx) — no Google Fonts round-trip -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inline critical CSS — paints the brand background and a centred spinner
      BEFORE any JS or external CSS loads. This drives FCP to near-zero: the
      browser renders coloured pixels as soon as the HTML is parsed.
      The #initial-loader is removed by main.jsx after React's first paint.
    -->
    <style>
      :root { color-scheme: dark; }
      *,*::before,*::after { box-sizing: border-box; }
      html, body { margin: 0; background: #0f172a; }
      #initial-loader {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #0f172a;
        z-index: 9999;
        opacity: 1;
      }
      @keyframes _il-spin { to { transform: rotate(360deg); } }
      #initial-loader > div {
        width: 32px; height: 32px;
        border: 2.5px solid rgba(148,163,184,0.18);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: _il-spin 0.65s linear infinite;
      }
    </style>
    <link rel="stylesheet" href="/src/index.css" />
    <!--
      Default (fallback) SEO тагове. Видими за crawler-и без JS (Facebook, Viber,
      Twitter scrapers), които четат само суровия HTML. JS crawler-ите (Googlebot)
      получават per-route таговете от <Seo>, който премахва тези default-и при mount
      (data-seo-default), за да няма дублиращи canonical / description тагове.
    -->
    <title data-seo-default>УниПът – Платформа за кандидат-студенти</title>
    <meta
      data-seo-default
      name="description"
      content="УниПът помага на кандидат-студенти да открият специалност, да изчислят кандидатстудентски бал и да сравнят приема в българските университети."
    />
    <link data-seo-default rel="canonical" href="https://uniput.eu/" />
    <meta data-seo-default property="og:type" content="website" />
    <meta data-seo-default property="og:site_name" content="УниПът" />
    <meta data-seo-default property="og:locale" content="bg_BG" />
    <meta data-seo-default property="og:url" content="https://uniput.eu/" />
    <meta data-seo-default property="og:title" content="УниПът – Платформа за кандидат-студенти" />
    <meta
      data-seo-default
      property="og:description"
      content="Открий специалност, изчисли бал и сравни приема в българските университети."
    />
    <meta data-seo-default property="og:image" content="https://uniput.eu/og/default.png" />
    <meta data-seo-default name="twitter:card" content="summary_large_image" />
    <meta data-seo-default name="twitter:title" content="УниПът – Платформа за кандидат-студенти" />
    <meta
      data-seo-default
      name="twitter:description"
      content="Открий специалност, изчисли бал и сравни приема в българските университети."
    />
    <meta data-seo-default name="twitter:image" content="https://uniput.eu/og/default.png" />
    <meta data-seo-default name="robots" content="index,follow" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <!--
      Inline loader: visible immediately at HTML parse time → FCP fires here,
      not after JS execution. Removed by main.jsx after React's first paint.
    -->
    <div id="initial-loader" aria-hidden="true"><div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
