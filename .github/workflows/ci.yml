# Автоматична проверка при всеки push и pull request:
# ESLint (стандарти на кода) → Vitest (автоматични тестове) → production build.
name: Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Тестовете и build-ът не се свързват с базата (заявките са mock-нати, SITEMAP_DYNAMIC
      # не е включен), но Supabase клиентът изисква URL при създаване — стигат фиктивни
      # стойности. Истинските ключове са само в Netlify.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Инсталиране на зависимостите
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Тестове (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Browser E2E тестове
        run: npm run test:e2e
