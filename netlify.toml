[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/email/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# GSC съобщава "Sitemap could not be read" — измерихме че Netlify Edge
# Brotli-компресира sitemap.xml/robots.txt при content negotiation
# (Content-Encoding: br). Не сме потвърдили на 100%, че GSC's sitemap
# fetcher не декодира Brotli правилно, но е документиран repeat pattern
# в community threads и `no-transform` е нискорисков стандартен fix:
# казва на Netlify's edge да не re-encode-ва отговора, независимо от
# Accept-Encoding на клиента. Ако проблемът беше Brotli decoding, това
# го решава; ако не — няма downside (файловете са малки, некомпресирани
# е незначителна разлика в bandwidth).
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, no-transform"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, no-transform"

# ── SPA routing + истински 404 ────────────────────────────────────────────────
# Netlify сервира статичните файлове (prerender-натите страници, assets, og,
# sitemap, robots, llms.txt, 404.html) ПРЕДИ тези правила, затова всички
# prerender-нати страници (/, /calculator, /universities/[slug], …) се сервират
# директно и не стигат дотук.
#
# Тук падат само пътища БЕЗ статичен файл. Client-only маршрутите (нямат
# prerender) трябва да получат app shell-а (200). Всеки е с две форми — точен
# и с наклонена черта (/login и /login/*) — за нула съмнение при trailing slash.
# Всичко останало (несъществуващи адреси) → истински 404 + noindex.

# Второ име за същия sitemap. Search Console пази статус „Couldn't fetch" за
# /sitemap.xml от първото (неуспешно) подаване и не го нулира при повторно
# подаване на същия адрес, въпреки че Googlebot го тегли без проблем (URL
# Inspection → Live test: „URL is available to Google", 12.11.2026). Подаването
# под нов адрес кара Google да го изтегли на чисто. Съдържанието е едно и също.
[[redirects]]
  from = "/sitemap-pages.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/login/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/register"
