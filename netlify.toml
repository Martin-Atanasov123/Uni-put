# /dzi-strateg вече е prerender-нат (собствен canonical + h1 в суровия HTML),
# затова НЯМА client-route правило тук — иначе /dzi-strateg (без наклонена черта)
# щеше да получи 200 с shell-а на НАЧАЛНАТА страница вместо 301 към /dzi-strateg/.
# Статичният файл се сервира пръв, точно както за /about, /calculator и т.н.
# Линковете от имейлите за напомняния (потвърждение / отписване) — client-only.
# Без тези правила стигаха до истинския 404 и отписването не работеше.
[[redirects]]
  from = "/reminders/confirm"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/reminders/confirm/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/reminders/unsubscribe"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/reminders/unsubscribe/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Пази per-university страниците: валидните имат prerender файл (сервира се пръв);
# невалиден slug → app shell (200), а не 404 — за да НЕ рискуваме реална уни
# страница да върне 404 при промяна на prerender конфига.
[[redirects]]
  from = "/universities/*"
  to = "/index.html"
  status = 200

# Всичко останало → истински 404 (страницата носи noindex)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
