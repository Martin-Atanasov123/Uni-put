<!doctype html>
<html lang="bg" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/university.png" />
    <title>Страницата не е намерена (404) | УниПът</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; }
      .card { max-width: 480px; }
      .code { font-family: monospace; font-size: 4rem; font-weight: 900; line-height: 1;
        background: linear-gradient(135deg, #06B6D4, #8B5CF6);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 1rem 0 0.5rem; }
      p { color: #94A3B8; line-height: 1.6; margin: 0 0 1.75rem; }
      .links { display: flex; flex-wrap: wrap; gap: 0.625rem; justify-content: center; }
      a { display: inline-flex; padding: 0.6rem 1.1rem; border-radius: 0.75rem;
        font-size: 14px; font-weight: 700; text-decoration: none; }
      .primary { background: linear-gradient(135deg, #06B6D4, #8B5CF6); color: #fff; }
      .ghost { border: 1px solid rgba(148,163,184,0.25); color: #e2e8f0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="code">404</div>
        <h1>Тази страница не съществува</h1>
        <p>Възможно е връзката да е остаряла или сгрешена. Върни се към началото или изчисли приемния си бал.</p>
        <div class="links">
          <a class="primary" href="/">Към началото</a>
          <a class="ghost" href="/calculator/">Калкулатор за бал</a>
          <a class="ghost" href="/universities/">Университети</a>
        </div>
      </div>
    </div>
  </body>
</html>
